<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pour toi ✨</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 40%, #1e1233 0%, #0d0a1a 60%, #06040c 100%);
      color: #fff;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 3;
    }

    /* Ambient stars in background */
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.3;
      animation: twinkle var(--duration, 3s) infinite ease-in-out alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.15; transform: scale(0.8); }
      100% { opacity: 0.8; transform: scale(1.3); }
    }

    /* The Main Center Button */
    .center-btn {
      position: relative;
      padding: 16px 36px;
      font-size: 1.15rem;
      font-weight: 500;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 
        0 8px 32px rgba(255, 75, 114, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      animation: gentle-pulse 2.8s infinite ease-in-out;
      outline: none;
    }

    .center-btn span.icon {
      display: inline-block;
      font-size: 1.25rem;
      animation: heartbeat 1.6s infinite ease-in-out;
    }

    .center-btn:hover {
      transform: translateY(-3px) scale(1.04);
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 150, 180, 0.45);
      box-shadow: 
        0 12px 40px rgba(255, 75, 114, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .center-btn:active {
      transform: scale(0.96);
    }

    @keyframes gentle-pulse {
      0%, 100% {
        box-shadow: 0 8px 25px rgba(255, 75, 114, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }
      50% {
        box-shadow: 0 14px 42px rgba(255, 75, 114, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.25); }
      28% { transform: scale(1); }
      42% { transform: scale(1.18); }
      70% { transform: scale(1); }
    }

    /* Button disappearing animation */
    .center-btn.hide {
      opacity: 0;
      transform: scale(0.4) rotate(-10deg);
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.5, 0, 0.75, 0);
    }

    /* Final Message */
    .message-card {
      position: absolute;
      max-width: 480px;
      width: 90%;
      padding: 32px 30px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(24px) scale(0.96);
      pointer-events: none;
      transition: opacity 1.8s cubic-bezier(0.16, 1, 0.3, 1), transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .message-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      animation: subtle-float 6s infinite ease-in-out;
    }

    @keyframes subtle-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .message-text {
      font-size: clamp(1.2rem, 4.5vw, 1.55rem);
      line-height: 1.6;
      font-weight: 350;
      letter-spacing: 0.3px;
      color: rgba(255, 255, 255, 0.78);
      text-shadow: 0 2px 20px rgba(255, 255, 255, 0.15);
    }

    /* Tung Tung Sahur Container & Animation */
    .tung-wrapper {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
      perspective: 900px;
    }

    .tung-wrapper.show {
      opacity: 1;
      transform: scale(1);
    }

    .tung-img {
      width: 140px;
      height: 140px;
      border-radius: 22px;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55), 0 0 24px rgba(255, 120, 160, 0.3);
      animation: tung-rotate 3.6s linear infinite;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    @keyframes tung-rotate {
      0% {
        transform: perspective(900px) rotateY(0deg);
      }
      100% {
        transform: perspective(900px) rotateY(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>
  <canvas id="canvas"></canvas>

  <div class="container">
    <button class="center-btn" id="mainBtn">Clique ici</button>

    <div class="message-card" id="messageCard">
      <p class="message-text">C'était juste pour te prévenir que je vais bientôt aller dormir</p>
      <div class="tung-wrapper" id="tungWrapper">
        <img src="tung-tung.png" alt="Tung Tung Sahur" class="tung-img" id="tungImg" />
      </div>
    </div>
  </div>

  <script>
    // --- Starry background generator ---
    const starsContainer = document.getElementById('stars');
    const starCount = 50;
    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 2.5 + 1;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
      star.style.animationDelay = `${Math.random() * 3}s`;
      starsContainer.appendChild(star);
    }

    // --- Audio chime generator (Web Audio API) ---
    function playChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5, E5, G5, C6, E6
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const startTime = ctx.currentTime + (i * 0.08);
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.045, startTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 1.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 1.25);
        });
      } catch (e) {
        // Audio might fail if restricted, fail silently
      }
    }

    // --- High-Performance Canvas Hearts ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let dpr = window.devicePixelRatio || 1;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.resetTransform?.();
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    // Standard Heart SVG Path
    const heartPath = new Path2D(
      "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
    );

    const colors = [
      '#ff4d6d', '#ff758f', '#ff85a1', '#f72585',
      '#b5179e', '#ff99c8', '#ffccd5', '#ffd166', '#ffffff'
    ];

    class Particle {
      constructor(x, y, options = {}) {
        this.x = x;
        this.y = y;
        
        const speed = options.speed ?? (Math.random() * 8 + 3);
        const angle = options.angle ?? (Math.random() * Math.PI * 2);
        
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        
        // Gravity & friction
        this.gravity = options.gravity ?? 0.04;
        this.drag = options.drag ?? 0.965;
        this.lift = options.lift ?? -0.06; // upward drift
        
        this.size = options.size ?? (Math.random() * 18 + 10);
        this.targetSize = this.size;
        this.scale = 0.1;
        
        this.rotation = Math.random() * Math.PI * 2;
        this.vRot = (Math.random() - 0.5) * 0.1;
        
        this.color = options.color || colors[Math.floor(Math.random() * colors.length)];
        this.alpha = 1;
        this.decay = options.decay ?? (Math.random() * 0.007 + 0.005);
        
        this.swaySpeed = Math.random() * 0.05 + 0.02;
        this.swayAmplitude = Math.random() * 1.5 + 0.5;
        this.phase = Math.random() * Math.PI * 2;
        this.isSparkle = options.isSparkle || false;
      }

      update() {
        this.phase += this.swaySpeed;
        this.vx += Math.sin(this.phase) * this.swayAmplitude * 0.08;
        this.vy += this.gravity + this.lift;
        
        this.vx *= this.drag;
        this.vy *= this.drag;
        
        this.x += this.vx;
        this.y += this.vy;
        
        if (this.scale < 1) {
          this.scale += 0.12;
          if (this.scale > 1) this.scale = 1;
        }

        this.rotation += this.vRot;
        this.alpha -= this.decay;
        return this.alpha > 0;
      }

      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.rotation);
        const currentScale = (this.size / 24) * this.scale;
        c.scale(currentScale, currentScale);
        c.globalAlpha = Math.max(0, this.alpha);

        if (this.isSparkle) {
          c.fillStyle = this.color;
          c.beginPath();
          c.arc(0, 0, 4, 0, Math.PI * 2);
          c.fill();
        } else {
          // Centering the 24x24 heart path at origin
          c.translate(-12, -12);
          c.fillStyle = this.color;
          c.shadowColor = this.color;
          c.shadowBlur = 10;
          c.fill(heartPath);
        }
        c.restore();
      }
    }

    const particles = [];

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.update()) {
          p.draw(ctx);
        } else {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Spawn massive explosion of hearts
    function burst(originX, originY) {
      // Immediate 360 burst
      const count = 90;
      for (let i = 0; i < count; i++) {
        const speed = Math.random() * 11 + 2;
        const angle = Math.random() * Math.PI * 2;
        particles.push(new Particle(originX, originY, {
          speed,
          angle,
          lift: -0.05,
          gravity: 0.03,
          drag: 0.965,
          decay: Math.random() * 0.006 + 0.005,
          size: Math.random() * 18 + 12
        }));
      }

      // Sparkles mixed in
      for (let i = 0; i < 35; i++) {
        particles.push(new Particle(originX, originY, {
          speed: Math.random() * 12 + 4,
          drag: 0.95,
          decay: Math.random() * 0.012 + 0.008,
          isSparkle: true,
          color: '#ffffff'
        }));
      }

      // Continuous gentle floating hearts stream for 2.2 seconds
      const streamDuration = 2200;
      const startTime = performance.now();
      
      const interval = setInterval(() => {
        const elapsed = performance.now() - startTime;
        if (elapsed > streamDuration) {
          clearInterval(interval);
          return;
        }

        const spreadX = originX + (Math.random() - 0.5) * 220;
        const startY = originY + (Math.random() - 0.5) * 80 + 20;

        particles.push(new Particle(spreadX, startY, {
          speed: Math.random() * 3.5 + 1.5,
          angle: -Math.PI / 2 + (Math.random() - 0.5) * 0.9,
          lift: -0.14,
          gravity: 0.01,
          drag: 0.985,
          decay: Math.random() * 0.005 + 0.004,
          size: Math.random() * 16 + 10
        }));
      }, 55);
    }

    // Interactive taps to spawn small hearts anywhere after message appears
    let canInteractiveSpawn = false;
    function spawnMiniHearts(x, y) {
      for (let i = 0; i < 6; i++) {
        particles.push(new Particle(x, y, {
          speed: Math.random() * 5 + 2,
          angle: -Math.PI / 2 + (Math.random() - 0.5) * 1.2,
          lift: -0.12,
          drag: 0.96,
          decay: 0.01,
          size: Math.random() * 14 + 10
        }));
      }
    }

    window.addEventListener('pointerdown', (e) => {
      if (!canInteractiveSpawn) return;
      spawnMiniHearts(e.clientX, e.clientY);
    });

    // --- Main Button Click Flow ---
    const mainBtn = document.getElementById('mainBtn');
    const messageCard = document.getElementById('messageCard');
    const tungWrapper = document.getElementById('tungWrapper');
    const tungImg = document.getElementById('tungImg');

    mainBtn.addEventListener('click', (e) => {
      const rect = mainBtn.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      // Sound
      playChime();

      // Hide Button with transition
      mainBtn.classList.add('hide');

      // Launch Hearts Animation
      burst(centerX, centerY);

      // Reveal Transparent Message after animation peak (~1.6s)
      setTimeout(() => {
        messageCard.classList.add('show');
        canInteractiveSpawn = true;

        // Reveal Tung Tung Sahur rotating on himself at the very end (~1.8s after message)
        setTimeout(() => {
          tungWrapper.classList.add('show');
        }, 1800);
      }, 1600);
    });

    // Tap Tung Tung Sahur to toggle / boost rotation speed
    if (tungImg) {
      tungImg.addEventListener('click', (e) => {
        e.stopPropagation();
        tungImg.style.animationDuration = tungImg.style.animationDuration === '0.8s' ? '3.6s' : '0.8s';
      });
    }
  </script>
</body>
</html>
